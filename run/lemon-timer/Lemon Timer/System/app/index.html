<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="author" content="Benjamin Lennon (lennonapps@outlook.com), with Hillary Lennon">
<!-- Lemon Timer. Made by Benjamin Lennon (lennonapps@outlook.com), author and project lead, with Hillary Lennon. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lemon Timer</title>
<link rel="icon" href="lemon.ico">
<style>
:root{
  --line:#2a1f1d; --hairLine:#000; --cheek:#f28c8c; --shoe:#2a2020;
  --wall:#f2e8d5; --ui:#fffdf8; --ink:#2b2622; --muted:#7a6f66; --accent:#e0b400; --accent2:#fff3b0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--wall);font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink)}
#scene{position:fixed;inset:0;width:100vw;height:100vh;display:block;overflow:visible}
body.hide-cursor{cursor:none}

/* control bar */
#bar{position:fixed;left:12px;right:12px;top:10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;
  background:color-mix(in srgb,var(--ui) 94%,transparent);border-radius:14px;box-shadow:0 2px 10px #0002;transition:opacity .4s,transform .4s;z-index:5}
#bar.hide{opacity:0;transform:translateY(-12px);pointer-events:none}
#bar label{font-size:.85rem;font-weight:600;color:var(--muted)}
#bar textarea{font:inherit;font-size:1rem;width:300px;height:3.1em;resize:vertical;padding:6px 8px;border-radius:9px;border:1px solid #0003}
#bar input[type=number]{width:64px;font:inherit;font-size:1.05rem;padding:5px;border-radius:9px;border:1px solid #0003}
#bar select{font:inherit;padding:5px;border-radius:9px;border:1px solid #0003;max-width:200px}
.grp{display:flex;align-items:center;gap:6px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid #0002;background:#fff;padding:7px 12px}
button:hover{background:#fffbe6}
button.main{background:var(--accent);border-color:#b89300;font-weight:700;min-width:96px}
button.on{background:var(--accent2);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
.sep{width:1px;align-self:stretch;background:#0001}

#count{position:fixed;left:18px;bottom:16px;padding:6px 16px;border-radius:999px;background:#2b2622d0;color:#fff;font:700 1.6rem/1.2 "Segoe UI",sans-serif;
  font-variant-numeric:tabular-nums;z-index:4;letter-spacing:.02em}
#count.hidden{display:none}

/* scene animation: transform/opacity only */
.skin{fill:var(--skin)} .hair{fill:var(--hair)} .outfit{fill:var(--outfit)} .outfit2{fill:var(--outfit2)} .shirt{fill:var(--shirt)} .shoe{fill:var(--shoe)}
#tchBody{transform-box:fill-box;transform-origin:50% 100%;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.5px)}}
.leg{transform-box:fill-box;transform-origin:50% 0}
#tch.seated .leg{display:none}
#tch.walk .leg.l{animation:stepA .14s ease-in-out infinite alternate}
#tch.walk .leg.r{animation:stepB .14s ease-in-out infinite alternate}
/* cut-out walk: feet just shuffle up and down */
@keyframes stepA{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes stepB{from{transform:translateY(-6px)}to{transform:translateY(0)}}
.shiver{animation:shiv .1s linear infinite alternate}
@keyframes shiv{to{transform:translateX(1.4px)}}
.munch{transform-box:fill-box;transform-origin:50% 50%;animation:munch .16s ease-in-out infinite alternate}
@keyframes munch{to{transform:scaleY(.35)}}
#deskLemons use.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.1)}70%{transform:scale(1.25)}100%{transform:scale(1)}}

/* teacher chooser */
#chooser{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:10}
#chooser[hidden]{display:none}
.chbox{background:var(--ui);border-radius:18px;box-shadow:0 10px 40px #0005;width:min(1100px,96vw);max-height:94vh;overflow:auto;display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:18px;padding:18px}
.chbox h2{margin:0 0 4px}
.chprev{background:linear-gradient(#eaf0f6 0 80%,#d7c3a4 80% 100%);border-radius:14px;position:relative;height:460px;overflow:hidden}
.chprev svg{position:absolute;left:50%;bottom:4px;width:300px;height:450px;margin-left:-150px}
.chprev.scurry svg{animation:zip 1.5s cubic-bezier(.5,0,.5,1)}
.chprev.scurry .leg.l{animation:stepA .16s ease-in-out infinite alternate}
.chprev.scurry .leg.r{animation:stepB .16s ease-in-out infinite alternate}
@keyframes zip{0%{transform:translateX(0)}42%{transform:translateX(260px)}42.01%{transform:translateX(-260px)}100%{transform:translateX(0)}}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.row > button{flex:1}
.ctl{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;align-content:start}
.ctl label{font-weight:600;font-size:.9rem}
.ctl select{font:inherit;padding:5px;border-radius:8px;border:1px solid #0003}
.styles{display:flex;gap:6px;flex-wrap:wrap}
.sw{display:inline-flex;gap:6px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid #0002;padding:0}
.sw button.on{outline:3px solid var(--accent);outline-offset:1px}
.chfoot{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end}
@media (max-width:760px){.chbox{grid-template-columns:1fr}}
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-label="Classroom"></svg>

<header id="bar">
  <div class="grp"><label for="msg">Message</label><textarea id="msg" spellcheck="true" placeholder="What she writes on the board"></textarea></div>
  <div class="grp"><label for="hrs">Hours</label><input id="hrs" type="number" min="0" max="3" value="0">
    <label for="mins">Minutes</label><input id="mins" type="number" min="0" max="59" value="10"></div>
  <div class="grp">
    <button id="start" class="main">Start</button>
    <button id="reset">Reset</button>
    <button id="plus" title="Add a minute (one more lemon)">+1 min</button>
  </div>
  <span class="sep"></span>
  <div class="grp"><select id="presets" title="Saved timers"><option value="">Saved timers…</option></select>
    <button id="savePreset" title="Save this message and time">Save</button><button id="delPreset" title="Delete the selected saved timer">Delete</button></div>
  <span class="sep"></span>
  <div class="grp">
    <button id="teacherBtn">Teacher</button>
    <button id="countBtn" class="on" title="Show or hide the countdown">Countdown</button>
    <button id="soundBtn" class="on" title="Sound on or off">Sound</button>
    <button id="fullBtn">Full screen</button>
    <button id="aboutBtn" title="Who made Lemon Timer">About</button>
  </div>
</header>

<div id="count">10:00</div>

<div id="chooser" hidden>
  <div class="chbox">
    <div>
      <h2>Choose your teacher</h2>
      <div class="chprev" id="chprev"></div>
      <div class="row"><button data-m="happy" class="on">Bubble tea</button><button data-m="sour">Lemon!</button><button data-act="scurry">Scurry</button></div>
    </div>
    <div class="ctl" id="ctl">
      <label>Style</label><div class="styles" id="chStyles"></div>
      <label for="chHair">Hair</label><select id="chHair"></select>
      <label for="chOutfit">Outfit</label><select id="chOutfit"></select>
      <label for="chRound">Roundness</label><input id="chRound" data-k="round" type="range" min="0.8" max="1.2" step="0.05">
      <label for="chHead">Head size</label><input id="chHead" data-k="head" type="range" min="0.85" max="1.2" step="0.05">
      <label for="chEyes">Eye size</label><input id="chEyes" data-k="eyes" type="range" min="0.85" max="1.3" step="0.05">
      <label for="chMouth">Mouth</label><select id="chMouth"><option value="smile">Smile</option><option value="cat">Cat mouth ω</option><option value="small">Small smile</option></select>
      <label for="chExtra">Extra</label><select id="chExtra"><option value="none">None</option><option value="bow">Hair bow</option><option value="clip">Hair clip</option><option value="lanyard">School lanyard</option><option value="pearls">Pearl earrings</option></select>
      <label>Skin</label><div class="sw" data-c="skin"></div>
      <label>Hair colour</label><div class="sw" data-c="hair"></div>
      <label>Top / dress</label><div class="sw" data-c="outfit"></div>
      <label>Skirt / trousers</label><div class="sw" data-c="outfit2"></div>
      <label>Blouse</label><div class="sw" data-c="shirt"></div>
    </div>
    <div class="chfoot"><button id="chDefault">Back to her original choice</button><button id="chCancel">Cancel</button><button id="chUse" class="main">Use this teacher</button></div>
  </div>
</div>

<script src="js/hw/geometry.js"></script>
<script src="js/hw/shaper.js"></script>
<script src="js/hw/typesetter.js"></script>
<script src="js/hw/nsw-foundation-cursive-ofl.js"></script>
<script src="js/version.js"></script>
<script src="js/credit.js"></script>
<script src="js/character.js"></script>
<script src="js/scene.js"></script>
<script src="js/timeline.js"></script>
<script src="js/sound.js"></script>
<script src="js/chooser.js"></script>
<script src="js/app.js"></script>
</body>
</html>
